name: build-release-stable
on:
  push:
    tags: 
      - 'v*'
    branches:
      - stellar
  workflow_dispatch:

env:
  python_win_version: 3.11.8
  # release type this file is used for
  release: stable

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11]

    steps:
    - uses: actions/checkout@v3
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libdbus-glib-1-dev libkrb5-dev
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r build/requirements/linux.txt
        pip install pylint
    - name: Test with unittest
      run: |
        export PYTHONPATH=${{ github.workspace }}:$PYTHONPATH
        python -m unittest tests/test_*.py

  windows-32:
    runs-on: windows-2022
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ env.python_win_version }}
          architecture: x86
      #  no PyQt6 for win32 available on pypi.org
      - run: ((Get-Content -path build/requirements/windows.txt -Raw) -replace 'pyqt6.*','pyqt5') | Set-Content -Path build/requirements/windows.txt
      - run: python -m pip install --no-warn-script-location -r build/requirements/windows.txt "cryptography==43.0.3"
      # pretty hacky but no other idea to avoid gssapi being installed which breaks requests-kerberos
      - run: python -m pip uninstall -y gssapi requests-gssapi
      - run: cd ${{ github.workspace }}/build; python build.py
        env:
          PYTHONPATH: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-32
          path: |
            build/dist/*.zip
            build/dist/*.exe
          retention-days: 1
          if-no-files-found: error

  windows-64:
    runs-on: windows-2022
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ env.python_win_version }}
          architecture: x64
      - run: python -m pip install --no-warn-script-location -r build/requirements/windows.txt "cryptography==43.0.3"
      # pretty hacky but no other idea to avoid gssapi being installed which breaks requests-kerberos
      - run: python -m pip uninstall -y gssapi requests-gssapi
      - run: cd ${{ github.workspace }}/build; python build.py
        env:
          PYTHONPATH: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-64
          path: |
            build/dist/*.zip
            build/dist/*.exe
          retention-days: 1
          if-no-files-found: error

  windows-64-debug:
    runs-on: windows-2022
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ env.python_win_version }}
          architecture: x64
      - run: python -m pip install --no-warn-script-location -r build/requirements/windows.txt "cryptography==43.0.3"
      # pretty hacky but no other idea to avoid gssapi being installed which breaks requests-kerberos
      - run: python -m pip uninstall -y gssapi requests-gssapi
      - run: cd ${{ github.workspace }}/build; python build.py debug
        env:
          PYTHONPATH: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-64-debug
          path: |
            build/dist/*.zip
          retention-days: 1
          if-no-files-found: error

  windows-win7:
    name: windows-win7-x64-${{ matrix.mode }}
    runs-on: windows-2022
    needs: test
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: '3.8.10'
          architecture: x64
      - run: python -m pip install -r build/requirements/windows-win7.txt
      - run: python -m pip uninstall -y gssapi requests-gssapi
      - name: Verify compatibility runtime
        run: |
          python -c "import sys, struct; assert sys.version_info[:3] == (3, 8, 10); assert struct.calcsize('P') == 8; from PyQt5.QtCore import QT_VERSION_STR; assert QT_VERSION_STR == '5.15.2'; import pip_system_certs.wrapt_requests; import win32api; print('Python / Qt / certificates / pywin32 imports OK')"
      - name: Build Win7 candidate
        run: cd build; python build.py ${{ matrix.mode }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          NAGSTAMON_BUILD_SUFFIX: '-win7'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-win7-x64-${{ matrix.mode }}
          path: |
            build/dist/*.zip
            build/dist/*.exe
          retention-days: 14
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: [windows-32, windows-64, windows-64-debug, windows-win7]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifact
          merge-multiple: true
      - run: cd artifact && md5sum *agstamon* > md5sums.txt
      - run: cd artifact && sha256sum *agstamon* > sha256sums.txt
      - uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          draft: true
          files: |
            artifact/*
